        <p>请按 README 的“Run Locally”启动本地 API 和网页服务，再访问 <code>http://127.0.0.1:5173/user.html</code>。GitHub 源码预览不会运行应用；GitHub Pages 也不会启动所需的 Node.js API。</p>
